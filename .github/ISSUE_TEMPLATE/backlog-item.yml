name: Backlog item
description: A unit of work an unattended session can pick up.
title: "[backlog] "
labels: ["tier:green"]
body:
  - type: markdown
    attributes:
      value: |
        **The `tier:` label decides what happens to this, not anything you type
        below.** This form applies `tier:green`, which means an unattended
        session may do the work and land it once CI is green.

        Change the label if that is wrong:

        - `tier:yellow` — a session will open a pull request and wait for you.
        - `tier:red` — never touched unattended.

        Add a `blocked:*` label and it is skipped until you remove it.
  - type: textarea
    id: summary
    attributes:
      label: What
      description: One paragraph. What should be true afterwards that is not true now.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a session knows it is done. Prefer a command and its expected result.
      placeholder: "`just ci` green, and `just test` asserts the new karg by name."
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - "P0 founding"
        - "P1 base swap"
        - "P2 terminal"
        - "P3 tools"
        - "P4 theme engine"
        - "P5 shell"
        - "P6 zoom"
        - "P7 publish"
        - "P8 install media"
        - "unsequenced"
    validations:
      required: true
  - type: input
    id: blocked_by
    attributes:
      label: Blocked by
      description: Issue reference, or what must happen first. Leave empty if ready.
