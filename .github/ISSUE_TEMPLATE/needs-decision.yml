name: Needs decision
description: Something a session could not settle alone.
title: "[decision] "
labels: ["needs-decision"]
body:
  - type: markdown
    attributes:
      value: |
        Raised when proceeding either way would be a guess. State the options
        fairly, including the one you did not pick.

        **How to answer one:**

        1. Comment with your decision and the reasoning.
        2. Remove the `needs-decision` label.

        That is the whole flow. These issues already carry a `tier:` label, so
        removing `needs-decision` is the only action needed to release the work
        — no second label to remember.

        Your comment becomes the instruction: an unattended session reads the
        issue **and every comment**, and is told that where a comment
        contradicts the description, the comment wins. So you do not need to
        rewrite the body.

        Change the `tier:` label first if the answer turned out bigger or
        smaller than expected — `tier:red` if it should never run unattended.
  - type: textarea
    id: question
    attributes:
      label: The question
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: Each with what it costs, not only what it gives.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: Which one, and why. Say if you are genuinely unsure.
    validations:
      required: true
  - type: textarea
    id: meanwhile
    attributes:
      label: What was done in the meantime
      description: What state the repository is in now. "Nothing" is a valid answer.
    validations:
      required: true
