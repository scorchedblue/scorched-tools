# SonarQube Cloud project identity. Both keys are required for Cloud; the
# project was created under the scorchedblue organisation and its key cannot be
# changed without creating a different project.
sonar.projectKey=scorchedblue_scorched-tools
sonar.organization=scorchedblue

sonar.sources=crates

# No sonar.tests: the tests here are inline `#[cfg(test)]` modules, not a
# separate tree. Pointing sonar.tests at the same path as sonar.sources makes
# the scanner index a file twice and fail.
